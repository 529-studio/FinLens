name: FinTrace Benchmark Regression

on:
  push:
    branches: [dev, main]
    paths:
      - 'benchmarks/**'
      - 'packages/core-engine/**'
      - '.github/workflows/benchmark-regression.yml'
  pull_request:
    branches: [dev, main]
    paths:
      - 'benchmarks/**'
      - 'packages/core-engine/**'
      - '.github/workflows/benchmark-regression.yml'
  workflow_dispatch:
    inputs:
      max_drop_percent:
        description: 'Maximum allowable metric drop in percentage points'
        required: false
        default: '2.0'
      fail_on_regression:
        description: 'Fail CI if regression detected'
        type: boolean
        required: false
        default: true

jobs:
  regression-benchmark:
    name: Golden Dataset Regression Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'packages/core-engine/requirements.txt'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Install Python Dependencies
        run: |
          cd packages/core-engine
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Golden Dataset Regression Benchmark
        run: |
          source packages/core-engine/.venv/bin/activate
          PYTHONPATH=packages/core-engine/src python benchmarks/eval_golden_suite.py \
            --baseline benchmarks/results/sprint8_golden_benchmark.json \
            --output benchmarks/results/golden_benchmark_ci.json \
            --markdown-summary "$GITHUB_STEP_SUMMARY" \
            --max-drop-percent ${{ inputs.max_drop_percent || '2.0' }} \
            --threshold-top1 0.85 \
            --threshold-top3 0.95 \
            --threshold-chart-blindness 0.0 \
            --threshold-iou 0.80 \
            --fail-on-regression

      - name: Upload Benchmark Results Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results-ci
          path: |
            benchmarks/results/golden_benchmark_ci.json
          retention-days: 14
