# FinTrace LAN Gateway Nginx Reverse Proxy Configuration
# Provides CORS handling for Office.js Excel Add-in and LAN Desktop Clients
# Handles WebSocket upgrades for real-time streaming (/ws/query/stream)

upstream fintrace_backend {
    server engine:8765;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # Global CORS headers
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

    # Handle preflight OPTIONS
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # Health check endpoint
    location = /health {
        proxy_pass http://fintrace_backend/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Real-time WebSocket token streaming endpoint
    location /ws/ {
        proxy_pass http://fintrace_backend/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # REST API endpoints
    location /api/ {
        proxy_pass http://fintrace_backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Root route - basic status
    location / {
        proxy_pass http://fintrace_backend/;
        proxy_set_header Host $host;
    }
}
