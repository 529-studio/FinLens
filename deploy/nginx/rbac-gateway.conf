# FinTrace Enterprise Banking Nginx RBAC Gateway Configuration
# Path-level proxy authentication, administrative IP restriction, and audit trail security
# Governed by Sprint 10 Task S10-03, AGENTS.md Rule 1, Rule 2, and Rule 13

upstream fintrace_rbac_backend {
    server engine:8765;
    keepalive 32;
}

# Map Authorization header presence to proxy variable
map $http_authorization $has_auth_token {
    default 1;
    ""      0;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # Global CORS headers for Office.js Add-in and Desktop Clients
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-FinTrace-Client' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range,X-Audit-Sequence' always;

    # Handle preflight OPTIONS requests cleanly
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # 1. Public Health & Authentication Endpoints
    location = /health {
        proxy_pass http://fintrace_rbac_backend/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location = /api/v1/auth/login {
        proxy_pass http://fintrace_rbac_backend/api/v1/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # 2. Administrative Endpoints (Admin-Only & Fail-Closed)
    # Restricts model downloads, system configuration, and cache purges
    location ~ ^/api/v1/(models|cache)/ {
        # Enforce fail-closed check: reject unauthenticated calls at the gateway
        if ($has_auth_token = 0) {
            return 401 '{"detail":"Access denied: Missing Authorization token for administrative gateway"}';
        }

        proxy_pass http://fintrace_rbac_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
    }

    # 3. Regulatory Audit Trail & Compliance Export Endpoints
    location ~ ^/api/v1/audit/ {
        if ($has_auth_token = 0) {
            return 401 '{"detail":"Access denied: Missing Authorization token for compliance audit logs"}';
        }

        proxy_pass http://fintrace_rbac_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
    }

    # 4. Document Ingestion & Indexing Endpoints (Senior Auditor & Admin)
    location ~ ^/api/v1/documents/(upload|ingest) {
        client_max_body_size 50M;

        proxy_pass http://fintrace_rbac_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 5. Real-Time WebSocket Streaming Endpoint
    location /ws/ {
        proxy_pass http://fintrace_rbac_backend/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 6. Standard Financial Query & Table Stitching APIs
    location /api/ {
        proxy_pass http://fintrace_rbac_backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Root route - status
    location / {
        proxy_pass http://fintrace_rbac_backend/;
        proxy_set_header Host $host;
    }
}
